name: gdms-ci

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: client/apps/gdms_app
        shell: pwsh
        run: flutter pub get

      - name: Validate workspace
        shell: pwsh
        run: .\scripts\quality\validate_workspace.ps1

      - name: Collect coverage
        shell: pwsh
        run: .\scripts\quality\collect_coverage.ps1

      - name: Assert backend coverage baseline
        shell: pwsh
        run: .\scripts\quality\assert_coverage.ps1 -BackendLineThresholdPct 54.0

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: artifacts/coverage
