[project]
name = "gdms-ocr-service"
version = "0.1.0"
description = "Servicio OCR local para GDMS."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "opencv-python-headless>=4.10",
    "python-multipart>=0.0.20",
    "pypdf>=6.0",
]

[project.optional-dependencies]
pdf = [
    "pdf2image>=1.17",
    "pypdf>=6.0",
]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
