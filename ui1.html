<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGD - Escaneo de Documentos</title>
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --bg: #f5f7fa;
    --sidebar-bg: #ffffff;
    --card-bg: #ffffff;
    --text: #202124;
    --text-secondary: #5f6368;
    --border: #dadce0;
    --success: #34a853;
    --error: #ea4335;
    --warning: #fbbc04;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    background: var(--primary);
    color: white;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 4px rgba(0,0,0,.12);
    z-index: 10;
  }
  .header h1 { font-size: 18px; font-weight: 500; }
  .header .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ea4335;
    margin-left: auto;
  }
  .header .status-dot.connected { background: var(--success); }
  .header .status-text { font-size: 13px; opacity: .9; }

  /* Layout */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 340px;
    min-width: 340px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  select, input[type="number"] {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: white;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }
  select:focus, input[type="number"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(26,115,232,.15);
  }

  .radio-group {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .radio-group label {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    font-size: 13px;
    cursor: pointer;
    background: white;
    border-right: 1px solid var(--border);
    transition: all .15s;
    user-select: none;
  }
  .radio-group label:last-child { border-right: none; }
  .radio-group input { display: none; }
  .radio-group input:checked + span {
    color: var(--primary);
    font-weight: 600;
  }
  .radio-group label:has(input:checked) {
    background: rgba(26,115,232,.08);
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
  }
  .toggle-row span { font-size: 13px; font-weight: 500; }

  .toggle {
    position: relative;
    width: 44px; height: 24px;
    appearance: none; -webkit-appearance: none;
    background: #ccc;
    border-radius: 12px;
    cursor: pointer;
    transition: background .2s;
    border: none;
    outline: none;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 20px; height: 20px;
    background: white;
    border-radius: 50%;
    transition: transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .toggle:checked { background: var(--primary); }
  .toggle:checked::after { transform: translateX(20px); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled {
    background: #94c4f7;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--bg); }
  .btn-danger {
    background: white;
    color: var(--error);
    border: 1px solid var(--border);
  }
  .btn-danger:hover { background: #fce8e6; }

  .btn-group { display: flex; gap: 8px; }
  .btn-group .btn { flex: 1; }

  /* Main area */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .toolbar {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--card-bg);
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
  }
  .toolbar .page-info {
    font-size: 13px;
    color: var(--text-secondary);
    margin-left: auto;
  }
  .toolbar .btn { padding: 6px 14px; font-size: 13px; }

  .preview-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-content: flex-start;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    gap: 12px;
    width: 100%;
    min-height: 300px;
  }
  .empty-state svg { opacity: .4; }
  .empty-state p { font-size: 14px; }

  .page-card {
    width: 180px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    transition: box-shadow .15s;
    cursor: pointer;
  }
  .page-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .page-card.selected { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(26,115,232,.2); }
  .page-card img {
    width: 100%;
    height: 220px;
    object-fit: contain;
    background: #f8f8f8;
    display: block;
  }
  .page-card .page-label {
    padding: 8px;
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
  }
  .page-card .page-actions {
    position: absolute;
    top: 6px; right: 6px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity .15s;
  }
  .page-card:hover .page-actions { opacity: 1; }
  .page-actions button {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.92);
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: background .15s;
  }
  .page-actions button:hover { background: white; }
  .page-actions button.delete:hover { background: #fce8e6; color: var(--error); }

  /* Scanning overlay */
  .scanning-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .scanning-overlay.active { display: flex; }
  .scanning-modal {
    background: white;
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,.2);
    min-width: 320px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .scanning-modal h3 { margin-bottom: 8px; font-size: 16px; }
  .scanning-modal p { color: var(--text-secondary); font-size: 14px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #323232;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 200;
    transform: translateY(80px);
    opacity: 0;
    transition: all .3s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { background: var(--error); }
</style>
</head>
<body>

<div class="header">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
  <h1>SGD &mdash; Escaneo de Documentos</h1>
  <div class="status-dot" id="statusDot"></div>
  <span class="status-text" id="statusText">Desconectado</span>
</div>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <div class="section-title">Escáner</div>
      <div class="form-group">
        <label for="scanner">Dispositivo</label>
        <select id="scanner">
          <option value="">Cargando escáneres...</option>
        </select>
      </div>
      <button class="btn btn-secondary" onclick="discoverScanners()" style="margin-top:8px;width:100%">
        &#x1f50d; Buscar escáneres
      </button>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-title">Configuración de escaneo</div>

      <div class="form-group">
        <label>Modo</label>
        <div class="radio-group">
          <label><input type="radio" name="scanMode" value="simplex" checked><span>Simple</span></label>
          <label><input type="radio" name="scanMode" value="duplex"><span>Doble faz</span></label>
        </div>
      </div>

      <div class="form-group" style="margin-top:12px">
        <label for="colorMode">Color</label>
        <select id="colorMode">
          <option value="">Por defecto del escáner</option>
          <option value="bw">Blanco y Negro</option>
          <option value="gray">Escala de grises</option>
          <option value="color">Color</option>
        </select>
      </div>

      <div class="form-group" style="margin-top:12px">
        <label for="dpi">Resolución (DPI)</label>
        <select id="dpi">
          <option value="">Por defecto del escáner</option>
          <option value="100">100 DPI</option>
          <option value="150">150 DPI</option>
          <option value="200">200 DPI</option>
          <option value="300" selected>300 DPI</option>
          <option value="400">400 DPI</option>
          <option value="600">600 DPI</option>
          <option value="1200">1200 DPI</option>
        </select>
      </div>

      <div class="toggle-row" style="margin-top:12px">
        <span>Descartar páginas en blanco</span>
        <input type="checkbox" class="toggle" id="blankPages">
      </div>

      <div class="form-group" style="margin-top:12px">
        <label for="timeout">Tiempo límite (seg)</label>
        <input type="number" id="timeout" value="90" min="15" max="300">
      </div>
    </div>

    <div class="divider"></div>

    <button class="btn btn-primary" id="btnScan" onclick="startScan()" style="width:100%;padding:14px">
      &#x1F4F7; Iniciar Escaneo
    </button>

    <div class="btn-group">
      <button class="btn btn-secondary" id="btnPdf" onclick="downloadPdf()" disabled>
        &#128196; Descargar PDF
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="toolbar" id="toolbar" style="display:none">
      <button class="btn btn-secondary" onclick="rotateSelected(90)" title="Rotar 90°">&#x21BB; Rotar</button>
      <button class="btn btn-secondary" onclick="rotateSelected(180)" title="Rotar 180°">&#x21C6; 180°</button>
      <button class="btn btn-danger" onclick="deleteSelected()" title="Eliminar página">&#x2715; Eliminar</button>
      <span class="page-info" id="pageInfo"></span>
    </div>

    <div class="preview-area" id="previewArea">
      <div class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="4" y="2" width="16" height="20" rx="2"/>
          <line x1="8" y1="6" x2="16" y2="6"/>
          <line x1="8" y1="10" x2="16" y2="10"/>
          <line x1="8" y1="14" x2="12" y2="14"/>
        </svg>
        <p>No hay páginas escaneadas</p>
        <p style="font-size:12px;">Configure los parámetros y presione "Iniciar Escaneo"</p>
      </div>
    </div>
  </main>
</div>

<!-- Scanning overlay -->
<div class="scanning-overlay" id="scanOverlay">
  <div class="scanning-modal">
    <div class="spinner"></div>
    <h3>Escaneando...</h3>
    <p id="scanProgress">Esperando páginas del escáner</p>
    <button class="btn btn-secondary" onclick="cancelScan()" style="margin-top:20px">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://127.0.0.1:43127';
let currentSession = null;
let selectedPage = null;
let scanners = [];

// Init
document.addEventListener('DOMContentLoaded', () => {
  checkHealth();
  discoverScanners();
});

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    if (r.ok) {
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').textContent = 'Conectado';
    }
  } catch {
    document.getElementById('statusDot').classList.remove('connected');
    document.getElementById('statusText').textContent = 'Desconectado';
  }
}

async function discoverScanners() {
  const sel = document.getElementById('scanner');
  try {
    const r = await fetch(`${API}/api/scanners`);
    scanners = await r.json();
    sel.innerHTML = '';
    if (scanners.length === 0) {
      sel.innerHTML = '<option value="">No se encontraron escáneres</option>';
    } else {
      scanners.forEach(s => {
        sel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
      });
    }
  } catch {
    sel.innerHTML = '<option value="">Error al conectar</option>';
  }
}

function getScanParams() {
  const params = {};
  const scannerId = document.getElementById('scanner').value;
  if (scannerId) params.scannerId = parseInt(scannerId);
  const dpi = document.getElementById('dpi').value;
  if (dpi) params.dpi = parseInt(dpi);
  const color = document.getElementById('colorMode').value;
  if (color) params.pixelType = color;
  const blank = document.getElementById('blankPages').checked;
  params.discardBlankPages = blank ? 'auto' : 'off';
  params.timeoutSeconds = parseInt(document.getElementById('timeout').value) || 90;
  return params;
}

async function startScan() {
  const mode = document.querySelector('input[name="scanMode"]:checked').value;
  const endpoint = `${API}/api/scans/adf/${mode}`;
  const params = getScanParams();

  document.getElementById('scanOverlay').classList.add('active');
  document.getElementById('scanProgress').textContent = 'Esperando páginas del escáner';

  try {
    const r = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    });
    const data = await r.json();

    if (!r.ok) {
      throw new Error(data.message || 'Error al escanear');
    }

    currentSession = data.sessionId || data.SessionId;
    await pollSession();
  } catch (e) {
    showToast(e.message, true);
  } finally {
    document.getElementById('scanOverlay').classList.remove('active');
  }
}

async function pollSession() {
  if (!currentSession) return;
  let attempts = 0;
  while (attempts < 120) {
    try {
      const r = await fetch(`${API}/api/scans/${currentSession}`);
      const data = await r.json();
      const status = data.status || data.Status;
      const pageCount = data.pageCount || data.PageCount || 0;

      document.getElementById('scanProgress').textContent = `${pageCount} página(s) escaneada(s)...`;

      if (status === 'completed' || status === 'empty') {
        renderPages(data);
        if (pageCount > 0) {
          showToast(`Escaneo completado: ${pageCount} página(s)`);
        } else {
          showToast('No se escanearon páginas', true);
        }
        return;
      }
      if (status === 'error' || status === 'canceled') {
        showToast(data.message || 'Error durante el escaneo', true);
        return;
      }
    } catch { /* retry */ }
    attempts++;
    await new Promise(r => setTimeout(r, 1000));
  }
  showToast('Tiempo de espera agotado', true);
}

function renderPages(data) {
  const area = document.getElementById('previewArea');
  const pages = data.pages || data.Pages || [];
  const pageCount = data.pageCount || data.PageCount || pages.length;
  const toolbar = document.getElementById('toolbar');

  if (pageCount === 0) {
    area.innerHTML = `<div class="empty-state">
      <p>El escaneo no produjo páginas</p>
    </div>`;
    toolbar.style.display = 'none';
    document.getElementById('btnPdf').disabled = true;
    return;
  }

  toolbar.style.display = 'flex';
  document.getElementById('btnPdf').disabled = false;
  document.getElementById('pageInfo').textContent = `${pageCount} página(s) — Sesión: ${currentSession.substring(0, 8)}...`;

  area.innerHTML = '';
  for (let i = 1; i <= pageCount; i++) {
    const card = document.createElement('div');
    card.className = 'page-card';
    card.dataset.page = i;
    card.onclick = (e) => {
      if (e.target.closest('.page-actions')) return;
      selectPage(i);
    };
    card.innerHTML = `
      <div class="page-actions">
        <button onclick="rotatePage(${i}, 90)" title="Rotar">&#x21BB;</button>
        <button class="delete" onclick="deletePage(${i})" title="Eliminar">&#x2715;</button>
      </div>
      <img src="${API}/api/scans/${currentSession}/pages/${i}/preview?width=320&quality=75&t=${Date.now()}"
           alt="Página ${i}" loading="lazy">
      <div class="page-label">Página ${i}</div>
    `;
    area.appendChild(card);
  }
}

function selectPage(num) {
  document.querySelectorAll('.page-card').forEach(c => c.classList.remove('selected'));
  if (selectedPage === num) {
    selectedPage = null;
  } else {
    selectedPage = num;
    document.querySelector(`.page-card[data-page="${num}"]`)?.classList.add('selected');
  }
}

async function rotatePage(pageNum, degrees) {
  try {
    const r = await fetch(`${API}/api/scans/${currentSession}/pages/${pageNum}/rotate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ degrees })
    });
    if (r.ok) {
      const data = await r.json();
      renderPages(data);
      showToast(`Página ${pageNum} rotada`);
    }
  } catch (e) {
    showToast('Error al rotar', true);
  }
}

function rotateSelected(degrees) {
  if (selectedPage) rotatePage(selectedPage, degrees);
  else showToast('Seleccione una página primero', true);
}

async function deletePage(pageNum) {
  if (!confirm(`¿Eliminar la página ${pageNum}?`)) return;
  try {
    const r = await fetch(`${API}/api/scans/${currentSession}/pages/${pageNum}`, { method: 'DELETE' });
    if (r.ok) {
      const data = await r.json();
      selectedPage = null;
      renderPages(data);
      showToast(`Página ${pageNum} eliminada`);
    }
  } catch (e) {
    showToast('Error al eliminar', true);
  }
}

function deleteSelected() {
  if (selectedPage) deletePage(selectedPage);
  else showToast('Seleccione una página primero', true);
}

function downloadPdf() {
  if (!currentSession) return;
  window.open(`${API}/api/scans/${currentSession}/pdf`, '_blank');
}

function cancelScan() {
  document.getElementById('scanOverlay').classList.remove('active');
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
